name: keepalive-touch

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commit a timestamp so the repo never goes 60 days idle
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-activity
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .last-activity
          git commit -m "touch $(date -u +%F)" || echo "nothing to commit"
          git push

